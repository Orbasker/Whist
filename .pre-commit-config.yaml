repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint (web)
        language: system
        entry: bash -c 'cd scoreboard && ( [ -d node_modules ] || npm install ) && npm run lint'
        pass_filenames: false
        files: ^scoreboard/src/.*\.(ts|tsx)$
        stages: [pre-commit]
